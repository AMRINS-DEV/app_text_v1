[project]
name = "agents-critic"
version = "0.1.0"
description = "critic-agent (§10.1): proposed signal + full evidence -> approve/reject + reasoning + adjusted confidence. The highest-leverage agent (§10.1) — sees counter-evidence and can veto. Phase 5 scope."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_critic"]
