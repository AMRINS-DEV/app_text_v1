[project]
name = "agents-graph"
version = "0.1.0"
description = "The news/pattern knowledge graph (§7): schema, an in-memory engine standing in for FalkorDB, ingest pipelines, outcome resolution, and the §7.2 conditional-reliability/confluence queries (§17 Phase 6)."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_graph"]
