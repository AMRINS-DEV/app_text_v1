[project]
name = "agents-core"
version = "0.1.0"
description = "BaseAgent, memory, evals, tracing (§10). Foundation every other agent package depends on."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_core"]
