[project]
name = "agents-vision"
version = "0.1.0"
description = "vision-agent (§10.1): rendered chart PNG (multi-TF) -> pattern list, S/R levels, structure read, confidence. Phase 5 scope."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_vision"]
