[project]
name = "agents-flow"
version = "0.1.0"
description = "flow-agent (§10.1): DOM, tick imbalance, volume profile -> absorption/imbalance/liquidity-sweep events. Deterministic + small model, real-time (T1). Phase 3/5 scope."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_flow"]
