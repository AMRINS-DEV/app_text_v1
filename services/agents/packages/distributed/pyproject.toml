[project]
name = "agents-distributed"
version = "0.1.0"
description = "§17 Phase 9 'distributed agents': a real multi-process work-queue dispatcher proving §16's own claim ('agents are stateless and horizontally scalable') across actual separate OS processes, not just separate Python objects in one process."
requires-python = ">=3.11"
dependencies = ["agents-core", "agents-regime", "numpy>=2.0"]

[tool.uv.sources]
agents-core = { workspace = true }
agents-regime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_distributed"]
