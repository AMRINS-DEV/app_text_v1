[project]
name = "agents-llm"
version = "0.1.0"
description = "Multi-provider LLM router (§10.2): capability matching, cost/latency budgets, circuit breaking, semantic caching, real provider adapters (Phase 5)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_llm"]
