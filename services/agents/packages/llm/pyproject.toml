[project]
name = "agents-llm"
version = "0.1.0"
description = "Multi-provider LLM router (§10.2): capability matching, cost/latency budgets, circuit breaking, semantic caching. Provider adapters are interface-complete stubs — no real API calls (Phase 0)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_llm"]
