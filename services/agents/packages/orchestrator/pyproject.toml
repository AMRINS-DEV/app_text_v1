[project]
name = "agents-orchestrator"
version = "0.1.0"
description = "LangGraph graphs wiring news/vision/pattern/regime/flow/critic agents together (§3.2, §10). Phase 5 scope — real dependency on `langgraph`/`pydantic-ai` added then, to keep Phase 0's `uv sync` light."
requires-python = ">=3.11"
dependencies = [
    "agents-core",
    "agents-news",
    "agents-vision",
    "agents-pattern",
    "agents-regime",
    "agents-flow",
    "agents-critic",
]

[tool.uv.sources]
agents-core = { workspace = true }
agents-news = { workspace = true }
agents-vision = { workspace = true }
agents-pattern = { workspace = true }
agents-regime = { workspace = true }
agents-flow = { workspace = true }
agents-critic = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_orchestrator"]
