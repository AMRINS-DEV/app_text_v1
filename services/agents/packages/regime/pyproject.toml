[project]
name = "agents-regime"
version = "0.1.0"
description = "regime-agent (§10.1): feature vector, cross-asset -> regime label + posterior probabilities. HMM/GBDT, no LLM. Phase 3/5 scope."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_regime"]
