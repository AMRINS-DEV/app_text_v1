[project]
name = "agents-news"
version = "0.1.0"
description = "Ingest -> NER -> impact scoring -> graph (§10.1). Phase 5 scope; real deps (feed parsers, an NER model) land then to keep Phase 0's `uv sync` light."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_news"]
