[project]
name = "agents-news"
version = "0.1.0"
description = "news-agent (§10.1): LLM triage/deep analysis -> structured NewsEvent. Graph ingest (§7) is Phase 6 scope, once FalkorDB exists."
requires-python = ">=3.11"
dependencies = ["agents-core", "agents-llm"]

[tool.uv.sources]
agents-core = { workspace = true }
agents-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_news"]
