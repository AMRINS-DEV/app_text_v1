[project]
name = "agents-mcp"
version = "0.1.0"
description = "MCP servers exposing market-data and journal tools — same tools usable from Claude Desktop for manual research (§3.2). timeseries/graph tools need QuestDB/FalkorDB (Phase 6+)."
requires-python = ">=3.11"
dependencies = ["agents-core", "mcp<2"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_mcp"]
