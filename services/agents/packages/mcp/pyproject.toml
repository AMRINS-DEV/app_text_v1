[project]
name = "agents-mcp"
version = "0.1.0"
description = "MCP servers exposing market-data, timeseries, graph and journal tools — same tools usable from Claude Desktop for manual research (§3.2). Phase 5/6 scope; real dependency on the `mcp` SDK added then."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_mcp"]
