[project]
name = "agents-pattern"
version = "0.1.0"
description = "pattern-agent (§10.1): OHLCV arrays + detector output -> pattern instances with geometry, target, invalidation. Mostly deterministic code; LLM only for narrative. Phase 5/6 scope."
requires-python = ">=3.11"
dependencies = ["agents-core"]

[tool.uv.sources]
agents-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_pattern"]
