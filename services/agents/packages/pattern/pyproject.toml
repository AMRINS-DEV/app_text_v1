[project]
name = "agents-pattern"
version = "0.1.0"
description = "pattern-agent (§10.1): OHLCV arrays + detector output -> pattern instances with geometry, target, invalidation. Mostly deterministic code; LLM only for narrative."
requires-python = ">=3.11"
dependencies = ["agents-core", "agents-llm", "numpy>=2.0"]

[tool.uv.sources]
agents-core = { workspace = true }
agents-llm = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_pattern"]
