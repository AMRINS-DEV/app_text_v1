[project]
name = "agents-models"
version = "0.1.0"
description = "Training, calibration, ONNX export (§8.2-8.3, §15)."
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "onnxmltools>=1.13",
    "onnx>=1.17",
    "onnxruntime>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_models"]
