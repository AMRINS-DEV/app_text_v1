[project]
name = "agents-models"
version = "0.1.0"
description = "Training, calibration, ONNX export (§8.2-8.3, §15). Real dependencies (lightgbm, torch, scikit-learn) land in Phase 3 — kept out of Phase 0's `uv sync` to avoid multi-GB downloads for a scaffold."
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_models"]
