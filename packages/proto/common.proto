syntax = "proto3";

package tradeos.v1;

enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_LONG = 1;
  DIRECTION_SHORT = 2;
  DIRECTION_FLAT = 3;
}

enum Side {
  SIDE_UNSPECIFIED = 0;
  SIDE_BUY = 1;
  SIDE_SELL = 2;
}

enum OrderType {
  ORDER_TYPE_UNSPECIFIED = 0;
  ORDER_TYPE_MARKET = 1;
  ORDER_TYPE_LIMIT = 2;
  ORDER_TYPE_STOP = 3;
}

enum TimeInForce {
  TIME_IN_FORCE_UNSPECIFIED = 0;
  TIME_IN_FORCE_GTC = 1;
  TIME_IN_FORCE_IOC = 2;
  TIME_IN_FORCE_FOK = 3;
}

enum TradingMode {
  TRADING_MODE_UNSPECIFIED = 0;
  TRADING_MODE_NORMAL = 1;
  TRADING_MODE_AGGRESSIVE = 2;
  TRADING_MODE_SCALP = 3;
  TRADING_MODE_PAPER = 4;
}

enum RegimeTag {
  REGIME_TAG_UNSPECIFIED = 0;
  REGIME_TAG_TRENDING = 1;
  REGIME_TAG_RANGING = 2;
  REGIME_TAG_EXPANSION = 3;
  REGIME_TAG_HIGH_VOL_CHOPPY = 4;
}
