name: tradeos

# Data plane + observability (§6, §16). `just infra-up` brings this up.
# Nothing here runs the Rust core, gateway, or agents — those are native
# processes started by `just dev` so they can be pinned/profiled/debugged
# directly on the host.

services:
  nats:
    image: nats:2.11-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222" # client
      - "8222:8222" # monitoring
    volumes:
      - nats-data:/data

  questdb:
    image: questdb/questdb:8.1.1
    ports:
      - "9000:9000" # web console + REST
      - "9009:9009" # ILP over TCP
      - "8812:8812" # postgres wire protocol
    volumes:
      - questdb-data:/var/lib/questdb

  postgres:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      POSTGRES_DB: tradeos
      POSTGRES_USER: tradeos
      POSTGRES_PASSWORD: tradeos_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379" # shared with redis protocol; falkordb is redis-module based
    volumes:
      - falkordb-data:/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.24.0
    ports:
      - "6380:6379" # kept off 6379 — falkordb already claims it
    ulimits:
      memlock: -1
    volumes:
      - dragonfly-data:/data

  prometheus:
    image: prom/prometheus:v3.0.1
    ports:
      - "9090:9090"
    volumes:
      - ../otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000" # 3000 is the dashboard's dev port
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    image: grafana/loki:3.3.2
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki

volumes:
  nats-data:
  questdb-data:
  postgres-data:
  falkordb-data:
  qdrant-data:
  dragonfly-data:
  prometheus-data:
  grafana-data:
  loki-data:
