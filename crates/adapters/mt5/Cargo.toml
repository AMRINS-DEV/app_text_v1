[package]
name = "adapter-mt5"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "MT5 adapter: ZeroMQ client talking to the MQL5 bridge EA (bridge/mt5). Full read+write, primary target platform (§5.4). Phase 1."

[dependencies]
domain.workspace = true
thiserror.workspace = true
rkyv = { version = "0.8", features = ["bytecheck", "smallvec-1"] }
smallvec.workspace = true
zeromq = "0.6"
tokio.workspace = true
crossbeam-channel = "0.5"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
mock-mt5-bridge.workspace = true
