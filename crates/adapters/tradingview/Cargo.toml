[package]
name = "adapter-tradingview"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "TradingView adapter: webhook alerts as an external signal source + a real UDF datafeed server for charting, backed by this project's own bar aggregation. TV has no general order-execution API — this adapter is signal-only, never a Broker (§5.4). §17 Phase 8 scope."

[dependencies]
domain.workspace = true
market-data.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel = "0.5"
axum = "0.7"
tokio.workspace = true

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
